schema_version: "1.1.0"
knowledge_id: "knowledge:global:generator-constant-detection"
object_revision: "1"
type: "GLOBAL_RULE"
knowledge_role: "DECISION_RULE_CANDIDATE"
claim: "A numeric parameter repeated unchanged across materially distinct generated presets should be treated as a possible generator/default constant, not automatically as Family Knowledge, a validated physical parameter, an Engine range, or a material-specific prior unless independent Evidence supports that interpretation."
claim_state: "CANDIDATE"
scope:
  decision_function: "parameter authority classification during comparative preset ingestion"
  polarity: "authority warning, not automatic invalidation"
supporting_source_refs:
  - "external-source:barcelona-bear-4-glb:55fc42968ed3"
observation_basis:
  - "Normal scale 0.72 and Clearcoat factor 1.0 repeat across four materially distinct presets."
  - "Thickness 0.01 and attenuation distance 0.05 repeat across three transmissive presets, including dark Onyx."
  - "Shared geometry and neutral PBR multipliers show deliberate generator-level constants."
contradicting_sources: []
duplicate_status: "NEW_CLAIM"
inference_boundary: "Repetition reduces material-specific authority when independent support is absent; legitimately shared physical values remain possible."
provenance:
  - source: "external-comparison:barcelona-bear-4-glb:2026-08-21"
    authority: "EXTERNAL_COMPARATIVE_SOURCE"
    evidence_status: "SOURCE_OBSERVATION_NOT_AUTO_EVIDENCE"
engine_dependency:
  required: false
  firewall: "Diagnostic classification cannot modify Engine accepted or validated ranges."
does_not_validate:
  - "that every repeated value is invalid"
  - "a universal numeric repetition threshold"
  - "automatic Knowledge promotion"
  - "automatic Family defaults"
  - "automatic Engine ranges"
loading_level: "DECISION"

