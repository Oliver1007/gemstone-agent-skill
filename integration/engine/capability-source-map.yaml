review_flags:
  - review_id: "engine-review:auto-shader-fallback"
    source: "engine-source:preview-runtime"
    concern: "Shader compile failure automatically switches to MeshPhysicalMaterial and continues rendering."
    evidence: "activateStandardMaterialFallback plus compileAsync catch path; runtime flag and console error exist."
    affected_capability: ["capability:transparent-volume-optics", "capability:diagnostic-rendering"]
    affected_case: ["case:smoky-quartz", "case:citrine"]
    blocks_auth_4: "OPTICAL_RENDER_AND_RENDER_DIAGNOSTIC_ACCEPTANCE_ONLY"
    blocks_auth_5: true
    route: "Require fallback state in Tool output and fail-closed Evidence acceptance before optical execution."
  - review_id: "engine-review:embedded-case-profiles"
    source: "engine-source:preview-runtime"
    concern: "Smoky and Citrine parameters/presets are embedded directly in runtime source instead of external Profile objects."
    evidence: "isSmoky/isCitrine routing and frozen lookPresets in preview.mjs."
    affected_capability: ["capability:transparent-volume-optics", "capability:optical-environment-presentation-separation"]
    affected_case: ["case:smoky-quartz", "case:citrine"]
    blocks_auth_4: false
    blocks_auth_5: true
    route: "Future Profile/Engine boundary review; do not extract values as defaults in AUTH-3."
  - review_id: "engine-review:analytic-cavity-geometry-assumption"
    source: "engine-source:preview-runtime"
    concern: "Optical path shader assumes unit-sphere and cylindrical through-hole analytic geometry."
    evidence: "smokySphereExit/smokyCylinderHit source path and fixed geometry uniforms."
    affected_capability: ["capability:transparent-volume-optics"]
    affected_case: ["case:smoky-quartz", "case:citrine"]
    blocks_auth_4: "GENERIC_TARGET_OPTICAL_DIAGNOSTICS_ONLY"
    blocks_auth_5: true
    route: "Pin exact compatible geometry identity before any optical operation."
  - review_id: "engine-review:artistic-inclusion-approximation"
    source: "engine-source:shared-geometry-builder"
    concern: "Sheets/wisps and shader absorption modifiers imitate inclusions without validated scattering."
    evidence: "Source comments explicitly describe the approximation; current shader multiplies transmittance."
    affected_capability: ["capability:deterministic-inclusion-layout"]
    affected_case: ["case:smoky-quartz"]
    blocks_auth_4: false
    blocks_auth_5: true
    route: "Disclose approximation and certification ceiling; do not label physical scattering."
